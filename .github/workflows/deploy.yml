name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          CMS_API_KEY: ${{ secrets.CMS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Package Prisma binaries
        run: tar -czf prisma-binaries.tar.gz node_modules/.prisma node_modules/@prisma

      - name: Prepare deploy package
        run: |
          mkdir -p deploy-pkg
          cp -r .next prisma deploy-pkg/
          cp package.json package-lock.json next.config.mjs prisma-binaries.tar.gz deploy-pkg/

      - name: Upload via FTP
        run: |
          sudo apt-get install -y lftp -qq
          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_HOST }}" << 'EOF'
          mirror --reverse --verbose deploy-pkg/ zunkiree-cms/
          quit
          EOF

      - name: Trigger server restart
        run: |
          curl -sf -X POST https://cms.primeceramics.com.np/api/deploy \
            -H "x-deploy-secret: ${{ secrets.DEPLOY_SECRET }}" \
            --retry 3 --retry-delay 5
